name: debug_lens
description: >-
  An in-app debugging overlay for Flutter: inspect network calls, logs, bloc
  events, navigation, storage, device info.
version: 1.0.0
homepage: https://github.com/anupam92402/DebugLens
repository: https://github.com/anupam92402/DebugLens
issue_tracker: https://github.com/anupam92402/DebugLens/issues
topics:
  - debugging
  - devtool
  - inspector
  - logging

platforms:
  android:
  ios:

screenshots:
  - description: The dashboard every inspector opens from.
    path: doc/screenshots/dashboard.png
  - description: Captured network calls with status and timing.
    path: doc/screenshots/network.png
  - description: The level-tagged log feed.
    path: doc/screenshots/logs.png
  - description: Remote config values, typed and overridable on the device.
    path: doc/screenshots/remote_config.png
  - description: Panel settings, roles and retention limits.
    path: doc/screenshots/settings.png

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  bloc: ^8.1.4
  dio: ^5.4.0
  connectivity_plus: ^4.0.2
  shared_preferences: ^2.3.2
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/dash.png

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
